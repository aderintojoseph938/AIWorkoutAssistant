<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workout Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
    <main id="container">
        <header>
            <div>
                <h1>AI Workout Assistant</h1>
                <p>Your camera spots the exercise and counts your reps. The assistant helps with your form.</p>
            </div>
            <button id="reset-button" class="secondary" onclick="nextGuest()">Next guest</button>
        </header>

        <div id="panels">
            <section class="panel" aria-label="Camera">
                <div id="camera">
                    <div id="webcam-container"></div>
                    <canvas id="my-canvas" width="400" height="400"></canvas>
                    <div id="camera-empty">
                        <p id="camera-status">Stand back so your whole body is in frame.</p>
                        <button id="start-button" onclick="init()">Start Webcam</button>
                    </div>
                </div>
                <div id="readout">
                    <div>
                        <h2>Detected exercise</h2>
                        <div id="current-exercise">Not started</div>
                    </div>
                    <div id="reps">
                        <h2>Reps</h2>
                        <div id="rep-count">0</div>
                    </div>
                </div>
                <button id="tip-button" onclick="askForTip()" disabled>Ask for a form tip</button>
                <div id="label-container"></div>
            </section>

            <section class="panel" id="chat-panel" aria-label="Chat">
                <h2>Ask the assistant</h2>
                <div id="chat-container">
                    <p id="chat-empty">Ask about your form, reps or what to try next.</p>
                </div>
                <div id="input-container">
                    <input type="text" id="user-input" placeholder="Type your message..." aria-label="Your message">
                    <button id="send-button" onclick="sendMessage()">Send</button>
                </div>
            </section>
        </div>
    </main>

    <!-- TensorFlow.js and Teachable Machine, saved in this repo so the demo works without internet -->
    <script src="{{ url_for('static', filename='vendor/tf.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/teachablemachine-pose.min.js') }}"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
