<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff: AI Workout Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
    <main id="container">
        <h1>Staff</h1>
        <p>This wipes the high scores for every move. It can't be undone. Type CLEAR to confirm.</p>
        <div id="input-container">
            <input type="text" id="user-input" aria-label="Type CLEAR">
            <button id="clear-button" onclick="clearBoard()">Clear the board</button>
        </div>
        <p id="staff-message"></p>
    </main>

    <script>
        function clearBoard() {
            fetch("/scores/clear", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ confirm: document.getElementById("user-input").value }),
            })
            .then((response) => response.json())
            .then((data) => {
                document.getElementById("staff-message").textContent = data.error || "The board is clear.";
            })
            .catch(() => {
                document.getElementById("staff-message").textContent = "Couldn't reach the app.";
            });
        }
    </script>
</body>
</html>
